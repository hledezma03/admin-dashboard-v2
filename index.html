<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-section-up">
                <div class="header-section-up-left">
                    <p class="search-icon">$</p>
                    <input type="text">
                </div>
                <div class="header-section-up-right">
                    <p class="notification-icon">$</p>
                    <p class="profile-picture-min">Picture</p>
                    <p class="name">Morgan Oakley</p>
                </div>
            </div>
            <div class="header-section-down">
                <div class="header-section-down-left">
                    <p class="profile-picture-big">Picture</p>
                    <div class="profile-picture-text">
                        <p>Hi, there</p>
                        <p>Morgan Oakley (@morgan)</p>
                    </div>
                </div>
                <div class="header-section-down-left">
                    <button class="header-btn">New</button>
                    <button class="header-btn">Upload</button>
                    <button class="header-btn">Share</button>
                </div>
            </div>
        </header>
        <aside class="sidebar">
            <div class="aside-section">
                <p class="aside-title">Dashboard</p>
            </div>
            <div class="aside-section">
                <p class="aside-text">Home</p>
                <p class="aside-text">Profile</p>
                <p class="aside-text">Messages</p>
                <p class="aside-text">History</p>
                <p class="aside-text">Tasks</p>
                <p class="aside-text">Communities</p>
            </div>
            <div class="aside-section">
                <p class="aside-text">Settings</p>
                <p class="aside-text">Support</p>
                <p class="aside-text">Privacy</p>
            </div>
        </aside>
        <main class="main-content"></main>
    </div>
</body>
</html>
